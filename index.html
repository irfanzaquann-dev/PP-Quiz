<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuiz Pengajian Perniagaan STPM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#131f24',
                        'brand-card': '#202f36',
                        'brand-green': '#58cc02',
                        'brand-green-dark': '#46a302',
                        'brand-red': '#ff4b4b',
                        'brand-red-dark': '#cc3c3c',
                        'brand-blue': '#1cb0f6',
                        'brand-blue-dark': '#1899d6',
                    },
                    fontFamily: {
                        sans: ['"Nunito"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Fizik Butang 3D */
        .btn-3d {
            transition: all 0.1s;
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 0px !important;
            margin-top: 4px;
        }
        .progress-bar-fill {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fade-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-brand-dark text-slate-800 dark:text-white min-h-screen flex flex-col font-sans transition-colors duration-300">

    <!-- Navigasi Atas -->
    <nav class="w-full p-4 flex justify-between items-center max-w-2xl mx-auto">
        <div class="text-2xl font-extrabold tracking-tight text-brand-blue">STPM<span class="text-brand-green">Kuiz</span></div>
        <button id="theme-toggle" class="p-2 rounded-full bg-slate-200 dark:bg-brand-card hover:bg-slate-300 dark:hover:bg-slate-700 transition">
            🌓
        </button>
    </nav>

    <main class="flex-1 w-full max-w-2xl mx-auto p-4 flex flex-col" id="app-container">
        
        <!-- Paparan 1: Pemilihan Topik -->
        <div id="view-home" class="fade-enter flex flex-col gap-4 mt-4">
            <h1 class="text-2xl font-black mb-4 text-center">Pilih Topik Semester 3</h1>
            
            <button onclick="startQuiz('Bab 8')" class="btn-3d w-full bg-brand-blue border-b-4 border-brand-blue-dark text-white rounded-2xl p-6 text-left relative overflow-hidden group">
                <div class="font-bold text-xl mb-1">Bab 8: Komunikasi</div>
                <div class="text-sm opacity-80 font-semibold">10 Soalan • Proses, Halangan & Perniagaan</div>
            </button>

            <button onclick="startQuiz('Bab 9')" class="btn-3d w-full bg-brand-green border-b-4 border-brand-green-dark text-white rounded-2xl p-6 text-left relative overflow-hidden group">
                <div class="font-bold text-xl mb-1">Bab 9: Keusahawanan</div>
                <div class="text-sm opacity-80 font-semibold">4 Soalan • Teori & Sifat Usahawan Berjaya</div>
            </button>

            <button onclick="startQuiz('Bab 10')" class="btn-3d w-full bg-purple-500 border-b-4 border-purple-700 text-white rounded-2xl p-6 text-left relative overflow-hidden group">
                <div class="font-bold text-xl mb-1">Bab 10: Etika</div>
                <div class="text-sm opacity-80 font-semibold">5 Soalan • Tanggungjawab Sosial & Integriti</div>
            </button>
        </div>

        <!-- Paparan 2: Enjin Kuiz -->
        <div id="view-quiz" class="hidden flex-col h-full fade-enter">
            <!-- Pengepala: Kemajuan & Rekod Berturut-turut (Streak) -->
            <div class="flex items-center gap-4 mb-8">
                <button onclick="showHome()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
                <div class="flex-1 h-4 bg-slate-200 dark:bg-brand-card rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-brand-green progress-bar-fill w-0 rounded-full"></div>
                </div>
                <div class="flex items-center gap-1 font-bold text-orange-500 text-lg">
                    🔥 <span id="streak-counter">0</span>
                </div>
            </div>

            <!-- Ruangan Soalan -->
            <div class="flex-1 flex flex-col">
                <h2 id="question-text" class="text-2xl font-black mb-8 leading-tight">Soalan akan dipaparkan di sini...</h2>
                
                <div id="options-container" class="flex flex-col gap-3">
                    <!-- Pilihan jawapan dimasukkan melalui JS -->
                </div>
            </div>

            <!-- Bar Tindakan Bawah -->
            <div id="action-bar" class="mt-8 pt-4 border-t-2 border-slate-200 dark:border-brand-card hidden opacity-0 transition-opacity">
                <button id="next-btn" onclick="nextQuestion()" class="btn-3d w-full bg-brand-green border-b-4 border-brand-green-dark text-white rounded-xl py-4 font-black text-lg uppercase tracking-wide">
                    Seterusnya
                </button>
            </div>
        </div>

        <!-- Paparan 3: Keputusan -->
        <div id="view-results" class="hidden flex-col items-center justify-center h-full fade-enter text-center mt-12">
            <h2 class="text-3xl font-black text-brand-green mb-2">Kuiz Selesai!</h2>
            <p class="text-slate-500 dark:text-slate-400 font-bold mb-8">Konsistensi membina kecemerlangan.</p>
            
            <div class="grid grid-cols-2 gap-4 w-full mb-8">
                <div class="bg-slate-100 dark:bg-brand-card p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700">
                    <div class="text-sm font-bold text-slate-400 uppercase tracking-wide">Markah</div>
                    <div id="final-score" class="text-3xl font-black text-brand-blue">0/0</div>
                </div>
                <div class="bg-slate-100 dark:bg-brand-card p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700">
                    <div class="text-sm font-bold text-slate-400 uppercase tracking-wide">Ketepatan</div>
                    <div id="final-accuracy" class="text-3xl font-black text-brand-green">0%</div>
                </div>
            </div>

            <button onclick="showHome()" class="btn-3d w-full bg-brand-blue border-b-4 border-brand-blue-dark text-white rounded-xl py-4 font-black text-lg uppercase tracking-wide">
                Kembali ke Menu Utama
            </button>
        </div>

    </main>

    <footer class="text-center p-6 text-xs font-bold text-slate-400 dark:text-slate-600">
        Dibina khas untuk calon STPM Kolej Tingkatan Enam Desa Mahkota.
    </footer>

    <script>
        const quizData = [
            // ================= BAB 8 (10 Soalan) =================
            {
                topic: "Bab 8",
                question: "Apakah langkah pertama dan terakhir dalam proses komunikasi?",
                options: [
                    "Penghantar dan Maklum Balas",
                    "Enkod dan Dekod",
                    "Saluran dan Penerima"
                ],
                correct: 0
            },
            {
                topic: "Bab 8",
                question: "Antara berikut, yang manakah merupakan contoh komunikasi bukan lisan?",
                options: [
                    "Perbincangan dan mesyuarat",
                    "Bahasa isyarat dan bahasa badan",
                    "Ucapan dan pembentangan"
                ],
                correct: 1
            },
            {
                topic: "Bab 8",
                question: "Internet boleh meluaskan peluang-peluang perniagaan melalui...",
                options: [
                    "Bersemuka dan panggilan telefon",
                    "Bahan bercetak dan media cetak",
                    "E-Dagang dan E-Pemasaran"
                ],
                correct: 2
            },
            {
                topic: "Bab 8",
                question: "Manakah antara berikut menyenaraikan halangan-halangan komunikasi yang tepat?",
                options: [
                    "Fizikal, Psikologikal, Sosiologikal, Semantik",
                    "Rohani, Jasmani, Emosi, Intelek",
                    "Ekonomi, Sosiologi, Psikologi"
                ],
                correct: 0
            },
            {
                topic: "Bab 8",
                question: "Tindakan berikut boleh mengatasi halangan komunikasi, KECUALI...",
                options: [
                    "Mendengar secara berkesan",
                    "Mengelakkan penggunaan perkataan yang kabur",
                    "Menggunakan gangguan proses komunikasi"
                ],
                correct: 2
            },
            {
                topic: "Bab 8",
                question: "Penawaran Nilai (Value Propositions) dan Segmen Pelanggan (Customer Segments) merupakan elemen dalam...",
                options: [
                    "Format Rancangan Perniagaan",
                    "Business Model Canvas (BMC)",
                    "Elemen Copywriting"
                ],
                correct: 1
            },
            {
                topic: "Bab 8",
                question: "Elemen 'Gesaan Tindakan' (Call To Action) dan 'Ciri-Ciri Unik Produk' (Unique Selling Point) amat penting dalam penulisan...",
                options: [
                    "Rumusan Eksekutif",
                    "Copywriting",
                    "Rancangan Organisasi"
                ],
                correct: 1
            },
            {
                topic: "Bab 8",
                question: "Apakah jenis 'Business Pitching' yang memfokuskan kepada pihak pelabur?",
                options: [
                    "Elevator Pitch",
                    "Investor Pitch",
                    "Sales Pitch"
                ],
                correct: 1
            },
            {
                topic: "Bab 8",
                question: "Dalam Format Rancangan Perniagaan, apakah bahagian yang ditulis selepas Rumusan Eksekutif?",
                options: [
                    "Objektif",
                    "Latar Belakang Syarikat",
                    "Pengenalan"
                ],
                correct: 2
            },
            {
                topic: "Bab 8",
                question: "Manakah antara berikut BUKAN saluran komunikasi yang dinyatakan dalam modul?",
                options: [
                    "Televisyen",
                    "Telefon",
                    "Bahan Bercetak"
                ],
                correct: 0
            },

            // ================= BAB 9 (4 Soalan) =================
            {
                topic: "Bab 9",
                question: "Apakah tiga pendekatan utama dalam teori-teori keusahawanan?",
                options: [
                    "Pendekatan Rohani, Jasmani, dan Emosi",
                    "Pendekatan Ekonomi, Psikologi, dan Sosiologi",
                    "Pendekatan Pengeluaran, Kewangan, dan Pemasaran"
                ],
                correct: 1
            },
            {
                topic: "Bab 9",
                question: "Antara sifat peribadi usahawan berjaya ialah berani mengambil risiko, berwawasan, dan...",
                options: [
                    "Pasif dan statik",
                    "Bijak merebut peluang",
                    "Hanya menunggu maklum balas"
                ],
                correct: 1
            },
            {
                topic: "Bab 9",
                question: "Menurut Stephen Covey, 'Tajamkan Gergaji' dan 'Bersinergi' merujuk kepada...",
                options: [
                    "Pendekatan teori keusahawanan",
                    "Sifat-sifat peribadi usahawan",
                    "Tabii orang berjaya"
                ],
                correct: 2
            },
            {
                topic: "Bab 9",
                question: "Pendekatan kejayaan seimbang antara dunia dan akhirat merangkumi elemen...",
                options: [
                    "Rohani, Jasmani, Emosi, Intelek",
                    "Ekonomi, Sosiologi, Psikologi",
                    "Utilitarian, Individualisme, Hak Moral"
                ],
                correct: 0
            },

            // ================= BAB 10 (5 Soalan) =================
            {
                topic: "Bab 10",
                question: "Antara berikut, yang manakah diklasifikasikan sebagai jenayah komersial?",
                options: [
                    "Pecah amanah, tuntutan palsu, dan skim cepat kaya",
                    "Pecah rumah dan kecurian",
                    "Pencemaran alam sekitar oleh warga korporat"
                ],
                correct: 0
            },
            {
                topic: "Bab 10",
                question: "Seorang warga korporat yang komited terhadap pihak berkepentingan perlu memfokuskan kepada...",
                options: [
                    "Pesaing antarabangsa dan media massa",
                    "Masyarakat, pelanggan, pekerja, pelabur, dan pembekal",
                    "Pengasas syarikat dan ahli pengurusan sahaja"
                ],
                correct: 1
            },
            {
                topic: "Bab 10",
                question: "Manakah antara berikut merupakan pendekatan tindakan beretika?",
                options: [
                    "Penawaran Nilai dan Saluran",
                    "Rohani, Jasmani, Emosi",
                    "Utilitarian, Individualisme, Hak Moral, Keadilan"
                ],
                correct: 2
            },
            {
                topic: "Bab 10",
                question: "Kuasa pembeli akan MENINGKAT apabila...",
                options: [
                    "Bilangan pembeli ramai dan produk sukar diganti",
                    "Bilangan pembeli sedikit dan kos pertukaran pembekal lain adalah rendah",
                    "Pembeli membeli dalam kuantiti yang kecil"
                ],
                correct: 1
            },
            {
                topic: "Bab 10",
                question: "Hak untuk mendapat maklumat, membuat pilihan, dan menyuarakan pendapat tergolong di bawah...",
                options: [
                    "Hak-Hak Pengguna",
                    "Hak Asasi Manusia",
                    "Peranan Warga Korporat"
                ],
                correct: 0
            }
        ];

        // Pengurusan Status
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let streak = 0;
        let answered = false;

        // DOM
        const viewHome = document.getElementById('view-home');
        const viewQuiz = document.getElementById('view-quiz');
        const viewResults = document.getElementById('view-results');
        const optionsContainer = document.getElementById('options-container');
        const actionBar = document.getElementById('action-bar');
        const progressBar = document.getElementById('progress-bar');
        
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        function showHome() {
            viewQuiz.classList.add('hidden');
            viewResults.classList.add('hidden');
            viewHome.classList.remove('hidden');
        }

        function startQuiz(topic) {
            currentQuestions = quizData.filter(q => q.topic === topic);
            currentIndex = 0;
            score = 0;
            streak = 0;
            updateStreak();
            
            viewHome.classList.add('hidden');
            viewResults.classList.add('hidden');
            viewQuiz.classList.remove('hidden');
            viewQuiz.style.display = 'flex';
            
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            actionBar.classList.add('hidden');
            actionBar.classList.remove('opacity-100');
            
            const q = currentQuestions[currentIndex];
            document.getElementById('question-text').innerText = q.question;
            
            // Animasi Bar Kemajuan
            const progress = (currentIndex / currentQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;

            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `btn-3d w-full text-left p-4 rounded-xl border-2 border-slate-200 border-b-4 dark:border-slate-700 bg-white dark:bg-brand-card font-bold text-lg transition-colors`;
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;
            
            const q = currentQuestions[currentIndex];
            const isCorrect = selectedIndex === q.correct;
            const allBtns = optionsContainer.children;

            if (isCorrect) {
                btnElement.classList.remove('border-slate-200', 'dark:border-slate-700', 'bg-white', 'dark:bg-brand-card');
                btnElement.classList.add('bg-brand-green', 'border-brand-green-dark', 'text-white');
                score++;
                streak++;
            } else {
                btnElement.classList.remove('border-slate-200', 'dark:border-slate-700', 'bg-white', 'dark:bg-brand-card');
                btnElement.classList.add('bg-brand-red', 'border-brand-red-dark', 'text-white', 'animate-shake');
                streak = 0;
                
                // Serlahkan jawapan yang betul
                allBtns[q.correct].classList.remove('border-slate-200', 'dark:border-slate-700', 'bg-white', 'dark:bg-brand-card');
                allBtns[q.correct].classList.add('bg-brand-green', 'border-brand-green-dark', 'text-white');
            }

            updateStreak();
            
            // Papar Butang Seterusnya
            actionBar.classList.remove('hidden');
            setTimeout(() => actionBar.classList.add('opacity-100'), 50);
            
            // Kemas kini bar kemajuan untuk menunjukkan soalan selesai
            const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        function updateStreak() {
            document.getElementById('streak-counter').innerText = streak;
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= currentQuestions.length) {
                showResults();
            } else {
                loadQuestion();
            }
        }

        function showResults() {
            viewQuiz.classList.add('hidden');
            viewResults.classList.remove('hidden');
            viewResults.style.display = 'flex';
            
            const accuracy = Math.round((score / currentQuestions.length) * 100);
            document.getElementById('final-score').innerText = `${score}/${currentQuestions.length}`;
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;
            
            const accuracyEl = document.getElementById('final-accuracy');
            accuracyEl.className = `text-3xl font-black ${accuracy >= 80 ? 'text-brand-green' : accuracy >= 50 ? 'text-orange-500' : 'text-brand-red'}`;
        }
    </script>
</body>
</html>
