<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuiz Pengajian Perniagaan STPM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#131f24',
                        'brand-card': '#202f36',
                        'brand-green': '#58cc02',
                        'brand-green-dark': '#46a302',
                        'brand-red': '#ff4b4b',
                        'brand-red-dark': '#cc3c3c',
                        'brand-blue': '#1cb0f6',
                        'brand-blue-dark': '#1899d6',
                    },
                    fontFamily: {
                        sans: ['"Nunito"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Fizik Butang 3D */
        .btn-3d {
            transition: all 0.1s;
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 0px !important;
            margin-top: 4px;
        }
        .progress-bar-fill {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fade-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-brand-dark text-slate-800 dark:text-white min-h-screen flex flex-col font-sans transition-colors duration-300">

    <!-- Navigasi Atas -->
    <nav class="w-full p-4 flex justify-between items-center max-w-2xl mx-auto">
        <div class="text-2xl font-extrabold tracking-tight text-brand-blue">STPM<span class="text-brand-green">Kuiz</span></div>
        <button id="theme-toggle" class="p-2 rounded-full bg-slate-200 dark:bg-brand-card hover:bg-slate-300 dark:hover:bg-slate-700 transition">
            🌓
        </button>
    </nav>

    <main class="flex-1 w-full max-w-2xl mx-auto p-4 flex flex-col" id="app-container">
        
        <!-- Paparan 1: Pemilihan Topik -->
        <div id="view-home" class="fade-enter flex flex-col gap-4 mt-4">
            <h1 class="text-2xl font-black mb-4 text-center">Pilih Topik Semester 3</h1>
            
            <!-- Buttons akan diisi oleh JavaScript dari quiz-data.json -->
        </div>

        <!-- Paparan 2: Enjin Kuiz -->
        <div id="view-quiz" class="hidden flex-col h-full fade-enter">
            <!-- Pengepala: Kemajuan & Rekod Berturut-turut (Streak) -->
            <div class="flex items-center gap-4 mb-8">
                <button onclick="showHome()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
                <div class="flex-1 h-4 bg-slate-200 dark:bg-brand-card rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-brand-green progress-bar-fill w-0 rounded-full"></div>
                </div>
                <div class="flex items-center gap-1 font-bold text-orange-500 text-lg">
                    🔥 <span id="streak-counter">0</span>
                </div>
            </div>

            <!-- Ruangan Soalan -->
            <div class="flex-1 flex flex-col">
                <h2 id="question-text" class="text-2xl font-black mb-8 leading-tight">Soalan akan dipaparkan di sini...</h2>
                
                <div id="options-container" class="flex flex-col gap-3">
                    <!-- Pilihan jawapan dimasukkan melalui JS -->
                </div>
            </div>

            <!-- Bar Tindakan Bawah -->
            <div id="action-bar" class="mt-8 pt-4 border-t-2 border-slate-200 dark:border-brand-card hidden opacity-0 transition-opacity">
                <button id="next-btn" onclick="nextQuestion()" class="btn-3d w-full bg-brand-green border-b-4 border-brand-green-dark text-white rounded-xl py-4 font-black text-lg uppercase tracking-wide">
                    Seterusnya
                </button>
            </div>
        </div>

        <!-- Paparan 3: Keputusan -->
        <div id="view-results" class="hidden flex-col items-center justify-center h-full fade-enter text-center mt-12">
            <h2 class="text-3xl font-black text-brand-green mb-2">Kuiz Selesai!</h2>
            <p class="text-slate-500 dark:text-slate-400 font-bold mb-8">Konsistensi membina kecemerlangan.</p>
            
            <div class="grid grid-cols-2 gap-4 w-full mb-8">
                <div class="bg-slate-100 dark:bg-brand-card p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700">
                    <div class="text-sm font-bold text-slate-400 uppercase tracking-wide">Markah</div>
                    <div id="final-score" class="text-3xl font-black text-brand-blue">0/0</div>
                </div>
                <div class="bg-slate-100 dark:bg-brand-card p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700">
                    <div class="text-sm font-bold text-slate-400 uppercase tracking-wide">Ketepatan</div>
                    <div id="final-accuracy" class="text-3xl font-black text-brand-green">0%</div>
                </div>
            </div>

            <div id="personal-best-container" class="w-full mb-8"></div>

            <button onclick="showHome()" class="btn-3d w-full bg-brand-blue border-b-4 border-brand-blue-dark text-white rounded-xl py-4 font-black text-lg uppercase tracking-wide">
                Kembali ke Menu Utama
            </button>
        </div>

    </main>

    <footer class="text-center p-6 text-xs font-bold text-slate-400 dark:text-slate-600">
        Dibina khas untuk calon STPM Kolej Tingkatan Enam Desa Mahkota.
    </footer>

    <script>
        // ========== UTILITY: SHUFFLE ALGORITHM ==========
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ========== LOAD DATA DARI JSON ==========
        let quizDatabase = null;
        let quizData = [];
        let currentTopic = '';

        async function loadQuizData() {
            try {
                const response = await fetch('quiz-data.json');
                if (!response.ok) throw new Error('Gagal load quiz data');
                quizDatabase = await response.json();
                console.log('✅ Quiz data loaded successfully');
                initializeUI();
            } catch (error) {
                console.error('⚠️ Error loading quiz data:', error);
                loadEmbeddedData();
            }
        }

        function loadEmbeddedData() {
            console.log('📦 Using fallback embedded data');
            quizDatabase = { quizzes: [] };
        }

        function initializeUI() {
            const viewHome = document.getElementById('view-home');
            
            // Find or create buttons container
            let buttonsContainer = viewHome.querySelector('.buttons-container');
            if (!buttonsContainer) {
                buttonsContainer = document.createElement('div');
                buttonsContainer.className = 'buttons-container flex flex-col gap-4';
                viewHome.appendChild(buttonsContainer);
            }
            
            // Clear existing buttons
            buttonsContainer.innerHTML = '';
            
            // Add buttons dari JSON
            if (quizDatabase && quizDatabase.quizzes) {
                quizDatabase.quizzes.forEach(quiz => {
                    const btn = document.createElement('button');
                    btn.className = `btn-3d w-full ${quiz.color} border-b-4 ${quiz.colorDark} text-white rounded-2xl p-6 text-left relative overflow-hidden group`;
                    btn.onclick = () => startQuiz(quiz.topic);
                    btn.innerHTML = `
                        <div class="font-bold text-xl mb-1">${quiz.title}</div>
                        <div class="text-sm opacity-80 font-semibold">${quiz.description}</div>
                    `;
                    buttonsContainer.appendChild(btn);
                });
            }
        }

        // ========== LOCAL STORAGE MANAGEMENT ==========
        const STORAGE_KEY = 'stpmQuizData';

        function initializeStorage() {
            if (!localStorage.getItem(STORAGE_KEY)) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    scores: [],
                    streaks: {},
                    lastUpdated: new Date().toISOString()
                }));
                console.log('📝 Local Storage initialized');
            }
        }

        function getStoredData() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        }

        function saveQuizResult(topic, score, total, accuracy, streak) {
            const data = getStoredData();
            
            // Simpan score
            data.scores.push({
                topic,
                score,
                total,
                accuracy,
                streak,
                date: new Date().toISOString()
            });
            
            // Update highest streak per topic
            if (!data.streaks[topic]) {
                data.streaks[topic] = { highest: streak, personal: streak };
            } else {
                data.streaks[topic].personal = streak;
                if (streak > data.streaks[topic].highest) {
                    data.streaks[topic].highest = streak;
                }
            }
            
            data.lastUpdated = new Date().toISOString();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            console.log('💾 Quiz result saved to local storage');
        }

        function getPersonalBest(topic) {
            const data = getStoredData();
            return data.streaks?.[topic]?.highest || 0;
        }

        // ========== PENGURUSAN STATUS ==========
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let streak = 0;
        let answered = false;

        // DOM
        const viewHome = document.getElementById('view-home');
        const viewQuiz = document.getElementById('view-quiz');
        const viewResults = document.getElementById('view-results');
        const optionsContainer = document.getElementById('options-container');
        const actionBar = document.getElementById('action-bar');
        const progressBar = document.getElementById('progress-bar');
        
        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        function showHome() {
            viewQuiz.classList.add('hidden');
            viewResults.classList.add('hidden');
            viewHome.classList.remove('hidden');
        }

        function startQuiz(topic) {
            // Find topic dari database
            const quizTopic = quizDatabase.quizzes.find(q => q.topic === topic);
            if (!quizTopic) {
                console.error('Topic tidak ditemukan:', topic);
                return;
            }
            
            currentTopic = topic;
            
            // Deep copy soalan dan shuffle
            currentQuestions = JSON.parse(JSON.stringify(quizTopic.questions));
            shuffleArray(currentQuestions);
            
            currentIndex = 0;
            score = 0;
            streak = 0;
            answered = false;
            
            updateStreak();
            
            viewHome.classList.add('hidden');
            viewResults.classList.add('hidden');
            viewQuiz.classList.remove('hidden');
            viewQuiz.style.display = 'flex';
            
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            actionBar.classList.add('hidden');
            actionBar.classList.remove('opacity-100');
            
            const q = currentQuestions[currentIndex];
            document.getElementById('question-text').innerText = q.question;
            
            // Animasi Bar Kemajuan
            const progress = (currentIndex / currentQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;

            optionsContainer.innerHTML = '';
            
            // Shuffle options sambil track original index
            const options = q.options.map((opt, idx) => ({ 
                option: opt, 
                originalIdx: idx 
            }));
            shuffleArray(options);
            
            options.forEach((item, displayIdx) => {
                const btn = document.createElement('button');
                btn.className = `btn-3d w-full text-left p-4 rounded-xl border-2 border-slate-200 border-b-4 dark:border-slate-700 bg-white dark:bg-brand-card font-bold text-lg transition-colors`;
                btn.innerText = item.option;
                btn.dataset.originalIdx = item.originalIdx;
                btn.dataset.displayIdx = displayIdx;
                btn.onclick = () => handleAnswer(item.originalIdx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;
            
            // Disable semua buttons immediately untuk prevent rapid clicking
            const allBtns = optionsContainer.children;
            Array.from(allBtns).forEach(btn => {
                btn.disabled = true;
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.6';
            });
            
            const q = currentQuestions[currentIndex];
            const isCorrect = selectedIndex === q.correct;

            if (isCorrect) {
                btnElement.classList.remove('border-slate-200', 'dark:border-slate-700', 'bg-white', 'dark:bg-brand-card');
                btnElement.classList.add('bg-brand-green', 'border-brand-green-dark', 'text-white');
                score++;
                streak++;
            } else {
                btnElement.classList.remove('border-slate-200', 'dark:border-slate-700', 'bg-white', 'dark:bg-brand-card');
                btnElement.classList.add('bg-brand-red', 'border-brand-red-dark', 'text-white', 'animate-shake');
                streak = 0;
                
                // Serlahkan jawapan yang betul
                Array.from(allBtns).forEach(btn => {
                    if (parseInt(btn.dataset.originalIdx) === q.correct) {
                        btn.classList.remove('border-slate-200', 'dark:border-slate-700', 'bg-white', 'dark:bg-brand-card');
                        btn.classList.add('bg-brand-green', 'border-brand-green-dark', 'text-white');
                    }
                });
            }

            updateStreak();
            
            // Papar Butang Seterusnya
            actionBar.classList.remove('hidden');
            setTimeout(() => actionBar.classList.add('opacity-100'), 50);
            
            // Kemas kini bar kemajuan
            const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;
            
            // Re-enable buttons selepas delay
            setTimeout(() => {
                Array.from(allBtns).forEach(btn => {
                    btn.disabled = false;
                    btn.style.pointerEvents = 'auto';
                    btn.style.opacity = '1';
                });
            }, 800);
        }

        function updateStreak() {
            document.getElementById('streak-counter').innerText = streak;
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= currentQuestions.length) {
                showResults();
            } else {
                loadQuestion();
            }
        }

        function showResults() {
            viewQuiz.classList.add('hidden');
            viewResults.classList.remove('hidden');
            viewResults.style.display = 'flex';
            
            const accuracy = Math.round((score / currentQuestions.length) * 100);
            const personalBest = getPersonalBest(currentTopic);
            
            // Simpan hasil ke localStorage
            saveQuizResult(currentTopic, score, currentQuestions.length, accuracy, streak);
            
            document.getElementById('final-score').innerText = `${score}/${currentQuestions.length}`;
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;
            
            // Papar personal best streak
            const personalBestContainer = document.getElementById('personal-best-container');
            personalBestContainer.innerHTML = `
                <div class="bg-slate-100 dark:bg-brand-card p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700">
                    <div class="text-sm font-bold text-slate-400 uppercase tracking-wide">🏆 Personal Best Streak</div>
                    <div class="text-3xl font-black text-orange-500">${personalBest}</div>
                </div>
            `;
            
            const accuracyEl = document.getElementById('final-accuracy');
            accuracyEl.className = `text-3xl font-black ${accuracy >= 80 ? 'text-brand-green' : accuracy >= 50 ? 'text-orange-500' : 'text-brand-red'}`;
        }

        // ========== PAGE INITIALIZATION ==========
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Initializing application...');
            initializeStorage();
            loadQuizData();
        });
    </script>
</body>
</html>
